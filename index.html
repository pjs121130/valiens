<style>
:root{--fg:#15161a;--mu:#6b7080;--ln:rgba(21,22,26,.1);--gold:#9a7b4f;--err:#c0392b;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--gl:blur(24px) saturate(170%)}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font-family:var(--sans);font-weight:300;line-height:1.7;background:linear-gradient(165deg,#f7f8fb,#e9edf3 60%,#f3f1ee);background-attachment:fixed;padding-top:env(safe-area-inset-top,0);-webkit-font-smoothing:antialiased}

h1,h2,h3,h4{font-family:var(--serif);font-weight:500;letter-spacing:.05em;margin:0 0 .5em}h2{font-size:32px}h3{font-size:22px}h4{font-size:18px}

.logo{cursor:pointer;font-family:var(--serif);font-size:28px;font-weight:500;letter-spacing:.42em;padding-left:.42em;line-height:1.2}
nav{display:flex;gap:4px 14px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:13px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px}@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}}

.img{aspect-ratio:4/5;width:100%;object-fit:cover;display:block;background:#e6e9ef}

.sws,.szs{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 18px}
.sw{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer}.sw.on{outline:2px solid var(--fg);outline-offset:3px}
.sz{padding:9px 18px;background:rgba(255,255,255,.6);color:var(--fg);border:1px solid var(--ln)}.sz.on{background:var(--fg);color:#fff}
.tier{padding:24px;margin-bottom:20px;border-radius:22px}
.post{border-bottom:1px solid var(--ln);padding:16px 0}.post a{font-size:12px}
.bar{height:6px;border-radius:9px;background:var(--ln);margin:12px 0}.bar i{display:block;height:100%;border-radius:9px;background:var(--fg)}
.tw{overflow-x:auto;border-radius:20px;padding:6px 14px}table{border-collapse:collapse;width:100%;min-width:560px}td,th{border-bottom:1px solid var(--ln);padding:12px 8px;text-align:left;font-size:14px}th{color:var(--mu);font-weight:400;font-size:12px;letter-spacing:.08em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:44px}@media(max-width:640px){.two{grid-template-columns:1fr;gap:22px}}
.pol h4{margin:22px 0 4px}.pol p,.pol li{font-size:14px;color:#444}.pol ul{padding-left:18px;margin:4px 0}
.ck{display:flex;align-items:flex-start;gap:8px;margin:6px 0 14px;font-size:13px}.ck input{width:auto;margin:5px 0 0}
.stp{display:flex;gap:4px;margin:10px 0}.stp span{flex:1;text-align:center;font-size:11px;padding:6px 0;border-top:2px solid var(--ln);color:var(--mu)}.stp span.on{border-color:var(--fg);color:var(--fg)}
.rimg{max-width:180px;max-height:220px;display:block;margin:8px 0;border-radius:12px;cursor:zoom-in}.rimg.big{max-width:100%;max-height:none;cursor:zoom-out}
a{color:inherit}footer{text-align:center;font-size:11px;letter-spacing:.3em;color:var(--mu);padding:28px 0 40px}footer a{color:var(--mu)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}main>*{animation:up .5s ease both}
@media(prefers-reduced-motion:reduce){main>*{animation:none}}
</style>

const img=p=>p.img?`<img class="img" src="${esc(p.img)}" alt="">`:`<div class="img ph">V</div>`;

 return `<div class="notice">NOTICE · 신규 가입 시 BRONZE 등급으로 시작해요. 리뷰 작성 시 +1,000P</div><section class="hero"><div class="eyebrow">2026 NEW SEASON</div><h1 class="wm">VALIENS</h1><p>유행보다 오래 입는 옷.<br>좋은 소재와 군더더기 없는 실루엣으로, 매일 입고 싶은 기본을 만듭니다.</p><button onclick="document.getElementById('g').scrollIntoView({behavior:'smooth'})">컬렉션 보기</button><div class="hl"><span>BRONZE</span><span>SILVER 5%</span><span>GOLD 10%</span><span>DIAMOND 15%</span><span>VIP 신상 무료</span></div></section>${tabs()}<div class="bar2"><input id="q" placeholder="옷 이름 검색" value="${esc(Q)}" oninput="A.search(this.value)"><select onchange="A.sort(this.value)"><option value="new" ${SORT==='new'?'selected':''}>최신순</option><option value="lo" ${SORT==='lo'?'selected':''}>낮은 가격순</option><option value="hi" ${SORT==='hi'?'selected':''}>높은 가격순</option></select><button class="o" onclick="ONLYW=!ONLYW;A.go('home')">${ONLYW?'전체 보기':'♥ 찜한 상품'}</button></div><div class="grid" id="g">${list()}</div>`};

 return `<button class="o" onclick="A.go('home')">← 목록</button><div class="two" style="margin-top:16px">${img(p)}<div><h2 style="margin-top:0">${esc(p.name)}</h2><h3>${won(p.price)}</h3><p style="white-space:pre-wrap">${esc(p.desc)}</p>${U.admin?'':p.vip?'<p class="mu">VIP 전용 신상 · VIP 등급은 무료</p>':`<p class="mu">${t.n} 등급 할인가 ${won(dp)} (${t.d}%)</p>`}${opt}${lock(p)?'<p class="mu">🔒 VIP 등급 전용 신상입니다.</p>':U.admin?'':`<button onclick="A.buy()">${p.vip?'무료로 받기':'구매하기'}</button> <button class="o" onclick="A.add()">장바구니</button>`} ${U.admin?`<button class="o" onclick="A.delProd('${p.id}')">상품 삭제</button>`:''}<h4 style="margin-top:28px">리뷰 (${rv.length}) ${rv.length?'★ '+(rv.reduce((a,x)=>a+x.star,0)/rv.length).toFixed(1):''}</h4>${rv.map(post).join('')||'<p class="mu">아직 리뷰가 없습니다.</p>'}</div></div>`};

 if(x.st==='배송중')return `${x.st}<br><span class="mu">${esc(CARR[x.ship?.c]||'')} ${esc(x.ship?.n||'')}</span><br><button onclick="A.done('${x.id}')">배송 완료</button>`;

V.my=async()=>{await loadU(au.currentUser);const t=tierOf(U.points),nx=TIERS[TIERS.indexOf(t)+1],pr=nx?Math.min(100,(U.points-t.min)/(nx.min-t.min)*100):100;
 return `<h2>내 등급</h2><div class="tier"><h3 style="margin:0">${t.n}</h3><div class="mu">보유 포인트 ${U.points.toLocaleString()}P · ${t.perk}</div><div class="bar"><i style="width:${pr}%"></i></div><div class="mu">${nx?`${nx.n}까지 ${(nx.min-U.points).toLocaleString()}P 남았어요`:'최고 등급입니다'}</div></div><p class="mu">포인트는 승급에만 쓰이며 가격에서 차감되지 않습니다. 옷 가격 1원당 1P(입금 확인 후), 리뷰 작성 시 1,000P가 적립됩니다.</p><div class="tw"><table><tr><th>등급</th><th>필요 포인트</th><th>혜택</th></tr>${TIERS.map(x=>`<tr><td>${x.n}${x===t?' ✓':''}</td><td>${x.min.toLocaleString()}P</td><td>${x.perk}</td></tr>`).join('')}</table></div><p style="margin-top:28px"><button class="o" onclick="A.leave()">회원 탈퇴</button></p>`};
V.privacy=()=>`<div class="pol"><button class="o" onclick="A.go(U?'home':'signup')">← 돌아가기</button><h2 style="margin-top:18px">개인정보 처리방침</h2><p>${OP}(이하 '운영자')는 VALIENS 서비스 제공을 위해 아래와 같이 개인정보를 처리합니다.</p>
<h4>1. 수집 항목</h4><ul><li>회원가입: 이름, 생년월일, 아이디, 비밀번호</li><li>주문·배송: 입금자명, 우편번호, 주소</li><li>이용 중 생성: 작성한 문의·리뷰, 주문 내역, 포인트·등급</li></ul>
<h4>2. 이용 목적</h4><p>회원 식별과 로그인, 주문 접수·입금 확인·배송, 등급·포인트 관리, 문의 응대.</p>
<h4>3. 보유 및 이용 기간</h4><p>회원 탈퇴 시까지 보관 후 지체 없이 파기합니다. 단, 전자상거래법에 따라 계약·청약철회 및 대금결제 기록은 5년, 소비자 불만·분쟁처리 기록은 3년간 보관합니다.</p>
<h4>4. 제3자 제공</h4><p>법령에 근거가 있는 경우를 제외하고 이용자의 동의 없이 제3자에게 제공하지 않습니다.</p>
<h4>5. 처리 위탁 및 국외 이전</h4><p>서비스 운영을 위해 Google LLC(Firebase)에 인증 및 데이터 저장을 위탁하며, 정보는 Google의 서버(해외 포함)에 암호화되어 전송·저장됩니다. 이전 항목은 위 수집 항목 전체, 이전 목적은 회원 인증 및 데이터 보관입니다. 비밀번호는 운영자가 볼 수 없는 방식으로 저장됩니다.</p>
<h4>6. 이용자의 권리</h4><p>이용자는 언제든지 개인정보의 열람·정정·삭제·처리정지를 요청할 수 있습니다. '내 등급' 화면의 회원 탈퇴로 계정을 삭제할 수 있으며, 그 외 요청은 아래 연락처로 문의해 주세요.</p>
<h4>7. 동의 거부 권리</h4><p>개인정보 수집·이용에 동의하지 않을 수 있으나, 필수 항목에 동의하지 않으면 회원가입이 제한됩니다.</p>
<h4>8. 안전성 확보 조치</h4><p>접근 권한 제한(본인과 관리자만 열람), 전송 구간 암호화, 비밀번호 암호화 저장.</p>
<h4>9. 개인정보 보호 책임자</h4><p>${OP} · ${MAIL}</p>
<h4>10. 변경 안내</h4><p>이 방침이 바뀌면 이 페이지에 공지합니다. 시행일: 2026년 11월 6일</p></div>`;

const rd=(f,m=1100,q=.86)=>new Promise(ok=>{const i=new Image();i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};i.onerror=()=>ok('');i.src=URL.createObjectURL(f)});

  if(l.some(x=>x.p.vip)&&t.n!=='VIP')throw{message:'VIP 전용 신상이 포함되어 있습니다.'};
  const z=$('cz').value.trim(),a=($('ca').value+' '+$('cd').value).trim();if(!/^[0-9]{5}$/.test(z)||!a)throw{message:'우편번호(5자리)와 주소를 입력해 주세요.'};
  const total=l.filter(x=>!x.p.vip).reduce((s,x)=>s+x.p.price,0),paid=Math.round(total*(100-t.d)/100);
  await setDoc(doc(db,'orders','V'+Date.now().toString(36).toUpperCase()),{uid:U.uid,name:U.name,payer:$('ck').value.trim()||U.name,items:l.map(x=>x.p.name+(x.k.split('|')[1]?` (${x.k.split('|')[1]}/${x.k.split('|')[2]})`:'')),total,disc:t.d,paid,zip:z,addr:a.slice(0,200),st:paid?'입금대기':'무료제공',at:new Date().toISOString()});
  cart=cart.filter(k=>!S.co.includes(k));saveCart();S.co=[];alert('주문이 접수되었습니다. 입금 계좌: 1002-0000-0000 (임건우)');A.go('orders')}),
 addProd:()=>run(async()=>{const n=$('an').value.trim(),p=+$('ap').value;if(!n||!(p>0))throw{message:'상품명과 가격을 입력해 주세요.'};const f=$('af').files[0];
  await addDoc(collection(db,'products'),{name:n.slice(0,60),price:Math.round(p),desc:$('ad').value.slice(0,1000),vip:$('av').checked,colors:S.nc,sizes:S.ns,img:f?await rd(f):'',at:new Date().toISOString()});alert('상품이 등록되었습니다.');A.go('home')}),
 delProd:id=>run(async()=>{if(!confirm('이 상품을 삭제할까요?'))return;await deleteDoc(doc(db,'products',id));A.go('home')}),
 confirm:id=>run(async()=>{const o=await getDoc(doc(db,'orders',id)),d=o.data();if(d.st!=='입금대기')return;
  await updateDoc(doc(db,'orders',id),{st:'입금확인'});await updateDoc(doc(db,'users',d.uid),{points:increment(d.total)});draw()}),
 ship:id=>run(async()=>{const n=$('sn_'+id).value.replace(/[^0-9A-Za-z-]/g,'');if(!n)throw{message:'송장번호를 입력해 주세요.'};await updateDoc(doc(db,'orders',id),{st:'배송중',ship:{c:$('sc_'+id).value,n}});draw()}),
 done:id=>run(async()=>{await updateDoc(doc(db,'orders',id),{st:'배송완료'});draw()})
};
</script>
</body>
